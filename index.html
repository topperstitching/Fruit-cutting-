<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Cutting Game - Doraemon Edition</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <div id="controls-hint">Swipe Left/Right | Swipe Up (Jump) | Swipe Down (Slide)</div>

    <!-- Three.js और GLTFLoader की स्क्रिप्ट लाइब्रेरी -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/jsm/loaders/GLTFLoader.js"></script>

    <script type="module">
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/jsm/loaders/GLTFLoader.js';

        // 1. सीन, कैमरा और रेंडरर सेटअप
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. लाइट्स (लाइटिंग सही होना जरूरी है वरना 3D मॉडल ब्लैक दिखेगा)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. ट्रैक (रनर गेम का ट्रैक)
        const trackGeometry = new THREE.PlaneGeometry(6, 100);
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x4a5568 });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -40;
        scene.add(track);

        // ट्रैक की साइड लाइन्स
        const lineGeo = new THREE.PlaneGeometry(0.1, 100);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-2, 0.01, -40);
        scene.add(leftLine);

        const rightLine = leftLine.clone();
        rightLine.position.x = 2;
        scene.add(rightLine);

        // 4. 3D डोरेमोन मॉडल लोड करना
        let player = new THREE.Group(); // प्लेयर का मुख्य कंटेनर
        scene.add(player);

        const loader = new GLTFLoader();

        // GitHub Repository की root फाइल 'scene.gltf' को लोड कर रहे हैं
        loader.load('scene.gltf', function (gltf) {
            const doraemon = gltf.scene;
            
            // 3D मॉडल का स्केल (साइज) और रोटेशन एडजस्ट करें
            doraemon.scale.set(0.8, 0.8, 0.8);
            doraemon.position.set(0, 0, 0);
            doraemon.rotation.y = Math.PI; // कैमरा की तरफ मुड़ने पर घुमाने के लिए

            player.add(doraemon);
            console.log("HD Doraemon Model Loaded Successfully!");
        }, undefined, function (error) {
            console.error("Model load hone me error aaya:", error);
        });

        // 5. गेम वैरियेबल्स और कंट्रोल्स
        let currentLane = 0; // -1: Left, 0: Center, 1: Right
        const laneWidth = 2;
        let score = 0;

        // स्वाइप कंट्रोल (Mobile Touch)
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && currentLane < 1) currentLane++;
                else if (diffX < -30 && currentLane > -1) currentLane--;
            }
        });

        // कीबोर्ड कंट्रोल्स (PC/Testing)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentLane > -1) currentLane--;
            if (e.key === 'ArrowRight' && currentLane < 1) currentLane++;
        });

        // 6. गेम लूप (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);

            // प्लेयर की पोजीशन स्मूथली चेंज करना
            player.position.x = THREE.MathUtils.lerp(player.position.x, currentLane * laneWidth, 0.1);

            // स्कोर बढ़ाना
            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 10);

            renderer.render(scene, camera);
        }

        // स्क्रीन साइज बदलने पर रिस्पॉन्सिव बनाना
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
