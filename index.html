<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Doraemon Subway Runner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #score { font-size: 28px; font-weight: bold; color: #facc15; }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #94a3b8;
            font-size: 15px;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 25px 40px;
            border-radius: 12px;
            text-align: center;
            color: white;
            z-index: 20;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading">Loading Doraemon Runner...</div>

    <div id="ui">
        <div id="score">Score: 0</div>
    </div>

    <div id="game-over">
        <h1 style="color: #ef4444; margin: 0 0 10px 0;">Game Over!</h1>
        <div id="final-score" style="font-size: 20px;">Score: 0</div>
        <button id="restart-btn" onclick="resetGame()">Play Again</button>
    </div>

    <div id="instructions">Swipe Left/Right | Swipe Up (Jump) | Swipe Down (Slide)</div>

    <script>
        let scene, camera, renderer;
        let player, nobitaModel;
        let score = 0, speed = 0.35;
        let currentLane = 0; // -1: Left, 0: Center, 1: Right
        const laneX = [-2, 0, 2];
        
        let isJumping = false, jumpVelocity = 0;
        let isSliding = false, slideTimer = 0;
        const gravity = -0.015;
        
        let obstacles = [];
        let isGameOver = false;
        let touchStartX = 0, touchStartY = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.rotation.x = -0.3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 15, 10);
            scene.add(dirLight);

            createTrack();
            loadCharacter();

            // Event Listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('touchstart', handleTouchStart);
            window.addEventListener('touchend', handleTouchEnd);
            window.addEventListener('resize', onWindowResize);
        }

        function createTrack() {
            const trackGeo = new THREE.PlaneGeometry(7, 200);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            const track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -80;
            scene.add(track);

            // Lane markers
            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.1, 200);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.3, 0.01, -80);
                scene.add(line);
            }
        }

        function loadCharacter() {
            // Doraemon Player Group
            player = new THREE.Group();

            // Doraemon Body (Blue Sphere)
            const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0284c7 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            player.add(body);

            // Doraemon Belly (White Sphere)
            const bellyGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const belly = new THREE.Mesh(bellyGeo, bellyMat);
            belly.position.set(0, 0.45, 0.2);
            player.add(belly);

            // Red Bell
            const bellGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const bellMat = new THREE.MeshStandardMaterial({ color: 0xeab308 });
            const bell = new THREE.Mesh(bellGeo, bellMat);
            bell.position.set(0, 0.65, 0.45);
            player.add(bell);

            player.position.set(0, 0, 0);
            scene.add(player);

            document.getElementById('loading').style.display = 'none';
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const obstacleGroup = new THREE.Group();
            const randomType = Math.floor(Math.random() * 3); // 0: Nobita, 1: Low Hurdle (Jump over), 2: High Barrier (Slide under)
            let obstacleType = "nobita";

            if (randomType === 0) {
                // Nobita Model Placeholder
                const headGeo = new THREE.SphereGeometry(0.35, 12, 12);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xfde047 }); // Yellow shirt / face
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 0.9;
                obstacleGroup.add(head);

                const bodyGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.8);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8 }); // Blue pants
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.position.y = 0.4;
                obstacleGroup.add(body);

                obstacleType = "nobita";
            } else if (randomType === 1) {
                // Low Barrier (Jump Over)
                const barGeo = new THREE.BoxGeometry(1.6, 0.5, 0.2);
                const barMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.y = 0.25;
                obstacleGroup.add(bar);

                obstacleType = "low";
            } else {
                // High Barrier (Slide Under)
                const barGeo = new THREE.BoxGeometry(1.6, 0.8, 0.2);
                const barMat = new THREE.MeshStandardMaterial({ color: 0xf97316 });
                const bar = new THREE.Mesh(barGeo, barMat);
                bar.position.y = 1.3; // High position
                obstacleGroup.add(bar);

                // Side pillars
                const pillarGeo = new THREE.CylinderGeometry(0.05, 0.05, 1.5);
                const pMat = new THREE.MeshStandardMaterial({ color: 0x64748b });
                const p1 = new THREE.Mesh(pillarGeo, pMat);
                p1.position.set(-0.7, 0.75, 0);
                const p2 = new THREE.Mesh(pillarGeo, pMat);
                p2.position.set(0.7, 0.75, 0);
                obstacleGroup.add(p1, p2);

                obstacleType = "high";
            }

            const randomLane = laneX[Math.floor(Math.random() * 3)];
            obstacleGroup.position.set(randomLane, 0, -40);
            obstacleGroup.userData = { type: obstacleType };

            scene.add(obstacleGroup);
            obstacles.push(obstacleGroup);
        }

        function handleKeyDown(e) {
            if (isGameOver) return;
            if (e.key === "ArrowLeft" && currentLane > -1) currentLane--;
            if (e.key === "ArrowRight" && currentLane < 1) currentLane++;
            if ((e.key === "ArrowUp" || e.key === " ") && !isJumping && !isSliding) {
                isJumping = true;
                jumpVelocity = 0.24;
            }
            if (e.key === "ArrowDown" && !isJumping && !isSliding) {
                startSlide();
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (isGameOver) return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && currentLane < 1) currentLane++;
                else if (diffX < -30 && currentLane > -1) currentLane--;
            } else {
                if (diffY < -30 && !isJumping && !isSliding) {
                    isJumping = true;
                    jumpVelocity = 0.24;
                } else if (diffY > 30 && !isJumping && !isSliding) {
                    startSlide();
                }
            }
        }

        function startSlide() {
            isSliding = true;
            slideTimer = 0;
            player.scale.set(1, 0.4, 1); // Shrink scale for sliding
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGameOver) return;

            // Player movement
            if (player) {
                player.position.x += (laneX[currentLane + 1] - player.position.x) * 0.2;

                // Jump logic
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                    }
                }

                // Slide logic
                if (isSliding) {
                    slideTimer += 0.05;
                    if (slideTimer > 1) {
                        isSliding = false;
                        player.scale.set(1, 1, 1); // Reset scale
                    }
                }
            }

            // Spawn Obstacles
            if (Math.random() < 0.022) spawnObstacle();

            // Move & Check Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                if (player) {
                    const distZ = Math.abs(obs.position.z - player.position.z);
                    const distX = Math.abs(obs.position.x - player.position.x);

                    if (distZ < 0.7 && distX < 0.7) {
                        const type = obs.userData.type;

                        // Collision logic based on barrier height and action
                        if (type === "nobita" && player.position.y < 0.8) {
                            triggerGameOver();
                        } else if (type === "low" && player.position.y < 0.5) {
                            triggerGameOver();
                        } else if (type === "high" && !isSliding) {
                            triggerGameOver();
                        }
                    }
                }

                // Remove out-of-screen obstacles
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = `Score: ${score}`;
                    if (score % 100 === 0) speed += 0.02;
                }
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Score: ${score}`;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            speed = 0.35;
            currentLane = 0;
            isJumping = false;
            isSliding = false;
            player.scale.set(1, 1, 1);
            player.position.set(0, 0, 0);

            document.getElementById('score').innerText = `Score: 0`;
            document.getElementById('game-over').style.display = 'none';

            for (let obs of obstacles) scene.remove(obs);
            obstacles = [];
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
