<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Soccer Pong - Phone Login</title>
    
    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDrsMo4f15JZxUk8LkNYqlYqfzEHOQ8Q4w",
          authDomain: "toppersewingmachine.firebaseapp.com",
          databaseURL: "https://toppersewingmachine-default-rtdb.firebaseio.com",
          projectId: "toppersewingmachine",
          storageBucket: "toppersewingmachine.firebasestorage.app",
          messagingSenderId: "281176461879",
          appId: "1:281176461879:web:97648170de01d8c975e5b2",
          measurementId: "G-GRP6EXGE3L"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let confirmationResultObj = null;

        // रीकैप्चा सेटअप (यह बैकग्राउंड में काम करता है)
        window.setupRecaptcha = function() {
            if (!window.recaptchaVerifier) {
                window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
                    'size': 'invisible', // इसे इनविजिबल रखा है ताकि यूजर को परेशान न होना पड़े
                    'callback': (response) => {
                        // रीकैप्चा पास होने पर
                    }
                });
            }
        };

        // 1. ओटीपी भेजने का फंक्शन
        window.sendOTP = function() {
            const phoneNumberInput = document.getElementById("phone-input").value.trim();
            const statusElem = document.getElementById("login-status");
            
            if (phoneNumberInput.length < 10) {
                statusElem.innerText = "कृपया सही फोन नंबर दर्ज करें (जैसे: +91XXXXXXXXXX)";
                return;
            }

            // अगर देश का कोड नहीं लगाया है, तो +91 अपने Jod दें
            let formattedPhone = phoneNumberInput;
            if (!formattedPhone.startsWith("+")) {
                formattedPhone = "+91" + formattedPhone;
            }

            statusElem.innerText = "OTP भेजा जा रहा है...";
            window.setupRecaptcha();
            const appVerifier = window.recaptchaVerifier;

            signInWithPhoneNumber(auth, formattedPhone, appVerifier)
                .then((confirmationResult) => {
                    confirmationResultObj = confirmationResult;
                    statusElem.innerText = "OTP भेज दिया गया है! कृपया नीचे दर्ज करें।";
                    document.getElementById("phone-step").style.display = "none";
                    document.getElementById("otp-step").style.display = "block";
                }).catch((error) => {
                    console.error("SMS not sent", error);
                    statusElem.innerText = "एरर: " + error.message;
                    // रीकैप्चा रीसेट करें
                    if (window.recaptchaVerifier) {
                        window.recaptchaVerifier.render().then(widgetId => grecaptcha.reset(widgetId));
                    }
                });
        };

        // 2. ओटीपी वेरिफाई करके लॉगिन करने का फंक्शन
        window.verifyOTP = function() {
            const otpInput = document.getElementById("otp-input").value.trim();
            const statusElem = document.getElementById("login-status");

            if (otpInput.length < 6) {
                statusElem.innerText = "कृपया 6 अंकों का सही OTP दर्ज करें।";
                return;
            }

            statusElem.innerText = "वेरिफ़ाई हो रहा है...";

            confirmationResultObj.confirm(otpInput).then((result) => {
                const user = result.user;
                console.log("Phone Login Success:", user.phoneNumber);
                hideLoginModal();
                if (typeof window.startGameAfterLogin === "function") {
                    window.startGameAfterLogin();
                }
            }).catch((error) => {
                console.error("Invalid OTP", error);
                statusElem.innerText = "गलत OTP! कृपया फिर से प्रयास करें।";
            });
        };

        // चेक करें कि यूजर पहले से लॉग-इन है या नहीं
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("User already logged in:", user.phoneNumber || user.email);
                hideLoginModal();
                if (typeof window.startGameAfterLogin === "function") {
                    window.startGameAfterLogin();
                }
            }
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background: #0a0d14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Home Screen */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #home-screen h1 {
            font-size: 32px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            margin-bottom: 10px;
            text-align: center;
        }
        #home-screen p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: #fff;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* In-App Phone Login Modal */
        #login-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 30;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: #161b22;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 340px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
        }
        .login-box h3 {
            color: #00f2fe;
            margin-bottom: 10px;
            font-size: 22px;
        }
        .login-box p {
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .input-box {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #0a0d14;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 10px;
            margin-bottom: 15px;
            text-align: center;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            color: #0a0d14;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .close-login {
            margin-top: 15px;
            background: transparent;
            border: none;
            color: #8b949e;
            font-size: 14px;
            cursor: pointer;
        }
        #login-status {
            margin-top: 12px;
            font-size: 13px;
            color: #ff3366;
            min-height: 20px;
        }

        /* Top HUD Header */
        .hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            z-index: 5;
            pointer-events: none;
        }
        .score-box {
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .exit-btn {
            pointer-events: auto;
            background: #ff3366;
            color: #fff;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Fullscreen Canvas */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Exit Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 290px;
        }
        .modal-content p {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes { background: #ff3366; color: white; }
        .btn-no { background: #444; color: white; }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="home-screen">
        <h1>NEON SOCCER PONG</h1>
        <p>2 Player Face-to-Face Mode</p>
        <button class="btn" onclick="showLoginModal()">
            📱 PHONE SIGN IN & PLAY
        </button>
    </div>

    <!-- IN-APP PHONE LOGIN MODAL -->
    <div id="login-modal">
        <div class="login-box">
            <h3>Phone Login</h3>
            <p>Enter your mobile number to receive an OTP inside this app.</p>
            
            <!-- Step 1: Phone Number Input -->
            <div id="phone-step">
                <input type="tel" id="phone-input" class="input-box" placeholder="Mobile Number (e.g. 9876543210)" />
                <button class="action-btn" onclick="sendOTP()">Send OTP</button>
            </div>

            <!-- Step 2: OTP Verification (Initially Hidden) -->
            <div id="otp-step" style="display: none;">
                <input type="text" id="otp-input" class="input-box" placeholder="Enter 6-digit OTP" maxlength="6" />
                <button class="action-btn" onclick="verifyOTP()">Verify & Play</button>
            </div>

            <div id="login-status"></div>
            
            <!-- Hidden container for reCAPTCHA -->
            <div id="recaptcha-container"></div>

            <button class="close-login" onclick="hideLoginModal()">Cancel</button>
        </div>
    </div>

    <!-- HUD OVERLAY -->
    <div class="hud">
        <div class="score-box">
            <span style="color: #ff007f;">P2: <span id="p2-score">0</span></span>
            &nbsp;|&nbsp;
            <span style="color: #00f2fe;">P1: <span id="p1-score">0</span></span>
        </div>
        <button class="exit-btn" onclick="showExitModal()">EXIT</button>
    </div>

    <!-- CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- EXIT CONFIRMATION MODAL -->
    <div id="exit-modal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to exit?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-yes" onclick="confirmExit()">Yes</button>
                <button class="modal-btn btn-no" onclick="hideExitModal()">No</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const p1ScoreElem = document.getElementById("p1-score");
        const p2ScoreElem = document.getElementById("p2-score");
        const homeScreen = document.getElementById("home-screen");
        const loginModal = document.getElementById("login-modal");
        const exitModal = document.getElementById("exit-modal");

        let p1Score = 0;
        let p2Score = 0;
        let gameRunning = false;

        const paddleWidth = 120;
        const paddleHeight = 20;

        const p1 = { x: 0, y: 0, w: paddleWidth, h: paddleHeight, color: "#00f2fe" };
        const p2 = { x: 0, y: 0, w: paddleWidth, h: paddleHeight, color: "#ff007f" };
        const ball = { x: 0, y: 0, r: 11, vx: 0, vy: 5, speed: 6, color: "#ffffff" };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            p1.y = canvas.height - 65; 
            p2.y = 55;
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        function showLoginModal() {
            loginModal.style.display = "flex";
        }

        function hideLoginModal() {
            loginModal.style.display = "none";
            document.getElementById("login-status").innerText = "";
            document.getElementById("phone-step").style.display = "block";
            document.getElementById("otp-step").style.display = "none";
        }

        window.startGameAfterLogin = function() {
            homeScreen.style.display = "none";
            p1Score = 0;
            p2Score = 0;
            p1ScoreElem.textContent = "0";
            p2ScoreElem.textContent = "0";
            p1.x = canvas.width / 2 - p1.w / 2;
            p2.x = canvas.width / 2 - p2.w / 2;
            resetBall(1);
            gameRunning = true;
        }

        function showExitModal() {
            gameRunning = false;
            exitModal.style.display = "flex";
        }

        function hideExitModal() {
            exitModal.style.display = "none";
            gameRunning = true;
        }

        function confirmExit() {
            exitModal.style.display = "none";
            homeScreen.style.display = "flex";
            gameRunning = false;
        }

        function handleInput(clientX, clientY) {
            if (clientY > canvas.height / 2) {
                p1.x = Math.max(5, Math.min(canvas.width - p1.w - 5, clientX - p1.w / 2));
            } else {
                p2.x = Math.max(5, Math.min(canvas.width - p2.w - 5, clientX - p2.w / 2));
            }
        }

        canvas.addEventListener("mousemove", (e) => {
            if (gameRunning) handleInput(e.clientX, e.clientY);
        });

        canvas.addEventListener("touchmove", (e) => {
            if (!gameRunning) return;
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleInput(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, { passive: false });

        function resetBall(targetPlayer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 6;
            ball.vy = (targetPlayer === 1 ? 1 : -1) * ball.speed;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
        }

        function update() {
            if (!gameRunning) return;

            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - ball.r <= 0) {
                ball.x = ball.r;
                ball.vx = -ball.vx;
            } else if (ball.x + ball.r >= canvas.width) {
                ball.x = canvas.width - ball.r;
                ball.vx = -ball.vx;
            }

            if (ball.y - ball.r <= 0) {
                p1Score++;
                p1ScoreElem.textContent = p1Score;
                resetBall(2);
                return;
            }

            if (ball.y + ball.r >= canvas.height) {
                p2Score++;
                p2ScoreElem.textContent = p2Score;
                resetBall(1);
                return;
            }

            if (
                ball.y + ball.r >= p1.y &&
                ball.y - ball.r <= p1.y + p1.h &&
                ball.x + ball.r >= p1.x &&
                ball.x - ball.r <= p1.x + p1.w
            ) {
                ball.y = p1.y - ball.r;
                let hitOffset = (ball.x - (p1.x + p1.w / 2)) / (p1.w / 2);
                let angle = hitOffset * (Math.PI / 3);
                ball.speed = Math.min(ball.speed + 0.3, 12);
                ball.vx = ball.speed * Math.sin(angle);
                ball.vy = -ball.speed * Math.cos(angle);
            }

            if (
                ball.y - ball.r <= p2.y + p2.h &&
                ball.y + ball.r >= p2.y &&
                ball.x + ball.r >= p2.x &&
                ball.x - ball.r <= p2.x + p2.w
            ) {
                ball.y = p2.y + p2.h + ball.r;
                let hitOffset = (ball.x - (p2.x + p2.w / 2)) / (p2.w / 2);
                let angle = hitOffset * (Math.PI / 3);
                ball.speed = Math.min(ball.speed + 0.3, 12);
                ball.vx = ball.speed * Math.sin(angle);
                ball.vy = ball.speed * Math.cos(angle);
            }
        }

        function drawField() {
            ctx.fillStyle = "#0a0d14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
            ctx.stroke();
        }

        function draw() {
            drawField();

            ctx.fillStyle = p1.color;
            ctx.shadowColor = p1.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(p1.x, p1.y, p1.w, p1.h, 8);
            ctx.fill();

            ctx.fillStyle = p2.color;
            ctx.shadowColor = p2.color;
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(p2.x, p2.y, p2.w, p2.h, 8);
            ctx.fill();

            ctx.shadowBlur = 0;

            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
