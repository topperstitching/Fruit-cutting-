<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doraemon Runner Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: #ffcc00;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        #controls-hint {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-size: 14px;
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <div id="controls-hint">Swipe Left/Right | Swipe Up (Jump) | Swipe Down (Slide)</div>

    <!-- Three.js और GLTFLoader की सही स्टैंडअलोन लाइब्रेरीज़ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // 1. सीन, कैमरा और रेंडरर सेटअप
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3, 7);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. लाइट्स (लाइटिंग सही होना जरूरी है)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. गेम का ट्रैक (Track)
        const trackGeometry = new THREE.PlaneGeometry(6, 100);
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x4a5568 });
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -40;
        scene.add(track);

        // ट्रैक लाइन्स
        const lineGeo = new THREE.PlaneGeometry(0.1, 100);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d2ff });
        const leftLine = new THREE.Mesh(lineGeo, lineMat);
        leftLine.rotation.x = -Math.PI / 2;
        leftLine.position.set(-2, 0.01, -40);
        scene.add(leftLine);

        const rightLine = leftLine.clone();
        rightLine.position.x = 2;
        scene.add(rightLine);

        // 4. डोरेमोन मॉडल या डिफ़ॉल्ट प्लेयर ग्रुप
        const player = new THREE.Group();
        scene.add(player);

        // बैकअप नीली बॉल (अगर मॉडल लोड होने में टाइम लगे)
        const fallbackGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x00aaff });
        const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
        fallbackMesh.position.y = 0.6;
        player.add(fallbackMesh);

        // 3D GLTF मॉडल लोड करना
        if (typeof THREE.GLTFLoader !== 'undefined') {
            const loader = new THREE.GLTFLoader();
            
            loader.load('./scene.gltf', function (gltf) {
                const model = gltf.scene;
                model.scale.set(0.8, 0.8, 0.8);
                model.position.set(0, 0, 0);
                model.rotation.y = Math.PI;

                // मॉडल लोड होते ही बैकअप बॉल को हटा दें
                player.remove(fallbackMesh);
                player.add(model);
                console.log("3D Model successfully loaded!");
            }, undefined, function (error) {
                console.error("Model load error:", error);
            });
        }

        // 5. गेम कंट्रोल्स
        let currentLane = 0; // -1: Left, 0: Center, 1: Right
        const laneWidth = 2;
        let score = 0;

        let touchStartX = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });

        window.addEventListener('touchend', (e) => {
            let diffX = e.changedTouches[0].clientX - touchStartX;
            if (diffX > 30 && currentLane < 1) currentLane++;
            else if (diffX < -30 && currentLane > -1) currentLane--;
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentLane > -1) currentLane--;
            if (e.key === 'ArrowRight' && currentLane < 1) currentLane++;
        });

        // 6. गेम लूप
        function animate() {
            requestAnimationFrame(animate);

            // प्लेयर की स्मूथ मूवमेंट
            player.position.x += (currentLane * laneWidth - player.position.x) * 0.1;

            // स्कोर
            score += 1;
            document.getElementById('score').innerText = Math.floor(score / 10);

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
