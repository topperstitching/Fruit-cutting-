<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Soccer Pong - Full Screen</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0d14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        /* Home Page Screen */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #home-screen h1 {
            font-size: 32px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.8);
            margin-bottom: 10px;
            text-align: center;
        }
        #home-screen p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .btn {
            background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        /* HUD - Score Overlay */
        .hud {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 5;
            pointer-events: none;
        }
        .score-box {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .exit-btn {
            pointer-events: auto;
            background: #ff3366;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
        }

        /* Canvas Fullscreen */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 290px;
        }
        .modal-content p {
            margin-bottom: 20px;
            font-size: 18px;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-yes { background: #ff3366; color: white; }
        .btn-no { background: #444; color: white; }
    </style>
</head>
<body>

    <!-- HOME PAGE SCREEN -->
    <div id="home-screen">
        <h1>NEON SOCCER PONG</h1>
        <p>2 Player Face-to-Face Mode</p>
        <button class="btn" onclick="startGame()">PLAY GAME</button>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="score-box">
            <span style="color: #ff007f;">P2: <span id="p2-score">0</span></span>
            &nbsp;|&nbsp;
            <span style="color: #00f2fe;">P1: <span id="p1-score">0</span></span>
        </div>
        <button class="exit-btn" onclick="showExitModal()">EXIT</button>
    </div>

    <!-- CANVAS -->
    <canvas id="gameCanvas"></canvas>

    <!-- EXIT CONFIRM MODAL -->
    <div id="exit-modal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to exit?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-yes" onclick="confirmExit()">Yes</button>
                <button class="modal-btn btn-no" onclick="hideExitModal()">No</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const p1ScoreElem = document.getElementById("p1-score");
        const p2ScoreElem = document.getElementById("p2-score");
        const homeScreen = document.getElementById("home-screen");
        const exitModal = document.getElementById("exit-modal");

        let p1Score = 0;
        let p2Score = 0;
        let gameRunning = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (p1 && p2) {
                p1.y = canvas.height - 35;
                p2.y = 20;
            }
        }
        window.addEventListener("resize", resizeCanvas);

        const paddleWidth = 100;
        const paddleHeight = 16;

        const p1 = {
            x: 0,
            y: 0,
            w: paddleWidth,
            h: paddleHeight,
            color: "#00f2fe"
        };

        const p2 = {
            x: 0,
            y: 0,
            w: paddleWidth,
            h: paddleHeight,
            color: "#ff007f"
        };

        const ball = {
            x: 0,
            y: 0,
            r: 10,
            vx: 0,
            vy: 5,
            speed: 6,
            color: "#ffffff"
        };

        resizeCanvas();

        function startGame() {
            homeScreen.style.display = "none";
            p1Score = 0;
            p2Score = 0;
            p1ScoreElem.textContent = "0";
            p2ScoreElem.textContent = "0";
            p1.x = canvas.width / 2 - p1.w / 2;
            p2.x = canvas.width / 2 - p2.w / 2;
            resetBall(1);
            gameRunning = true;
        }

        function showExitModal() {
            gameRunning = false;
            exitModal.style.display = "flex";
        }

        function hideExitModal() {
            exitModal.style.display = "none";
            gameRunning = true;
        }

        function confirmExit() {
            exitModal.style.display = "none";
            homeScreen.style.display = "flex";
            gameRunning = false;
        }

        function handleInput(clientX, clientY) {
            if (clientY > canvas.height / 2) {
                p1.x = Math.max(5, Math.min(canvas.width - p1.w - 5, clientX - p1.w / 2));
            } else {
                p2.x = Math.max(5, Math.min(canvas.width - p2.w - 5, clientX - p2.w / 2));
            }
        }

        canvas.addEventListener("mousemove", (e) => {
            if (gameRunning) handleInput(e.clientX, e.clientY);
        });

        canvas.addEventListener("touchmove", (e) => {
            if (!gameRunning) return;
            e.preventDefault();
            for (let i = 0; i < e.touches.length; i++) {
                handleInput(e.touches[i].clientX, e.touches[i].clientY);
            }
        }, { passive: false });

        function resetBall(targetPlayer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = 6;
            ball.vy = (targetPlayer === 1 ? 1 : -1) * ball.speed;
            ball.vx = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2);
        }

        function update() {
            if (!gameRunning) return;

            ball.x += ball.vx;
            ball.y += ball.vy;

            // Side Wall Bounce
            if (ball.x - ball.r <= 0) {
                ball.x = ball.r;
                ball.vx = -ball.vx;
            } else if (ball.x + ball.r >= canvas.width) {
                ball.x = canvas.width - ball.r;
                ball.vx = -ball.vx;
            }

            // Entire Top Line is Goal for P1
            if (ball.y - ball.r <= 0) {
                p1Score++;
                p1ScoreElem.textContent = p1Score;
                resetBall(2);
                return;
            }

            // Entire Bottom Line is Goal for P2
            if (ball.y + ball.r >= canvas.height) {
                p2Score++;
                p2ScoreElem.textContent = p2Score;
                resetBall(1);
                return;
            }

            // Player 1 Paddle Collision (Bottom)
            if (
                ball.y + ball.r >= p1.y &&
                ball.y - ball.r <= p1.y + p1.h &&
                ball.x + ball.r >= p1.x &&
                ball.x - ball.r <= p1.x + p1.w
            ) {
                ball.y = p1.y - ball.r;
                let hitOffset = (ball.x - (p1.x + p1.w / 2)) / (p1.w / 2);
                let angle = hitOffset * (Math.PI / 3);
                ball.speed = Math.min(ball.speed + 0.3, 12);
                ball.vx = ball.speed * Math.sin(angle);
                ball.vy = -ball.speed * Math.cos(angle);
            }

            // Player 2 Paddle Collision (Top)
            if (
                ball.y - ball.r <= p2.y + p2.h &&
                ball.y + ball.r >= p2.y &&
                ball.x + ball.r >= p2.x &&
                ball.x - ball.r <= p2.x + p2.w
            ) {
                ball.y = p2.y + p2.h + ball.r;
                let hitOffset = (ball.x - (p2.x + p2.w / 2)) / (p2.w / 2);
                let angle = hitOffset * (Math.PI / 3);
                ball.speed = Math.min(ball.speed + 0.3, 12);
                ball.vx = ball.speed * Math.sin(angle);
                ball.vy = ball.speed * Math.cos(angle);
            }
        }

        function drawField() {
            ctx.fillStyle = "#0a0d14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();
            ctx.setLineDash([]);

            // Center Circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
            ctx.stroke();
        }

        function draw() {
            drawField();

            // Player 1 Paddle
            ctx.fillStyle = p1.color;
            ctx.beginPath();
            ctx.roundRect(p1.x, p1.y, p1.w, p1.h, 8);
            ctx.fill();

            // Player 2 Paddle
            ctx.fillStyle = p2.color;
            ctx.beginPath();
            ctx.roundRect(p2.x, p2.y, p2.w, p2.h, 8);
            ctx.fill();

            // Ball
            ctx.fillStyle = ball.color;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
