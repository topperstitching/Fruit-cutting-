<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Fruit Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
            font-family: sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 28px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 2px 2px 4px #000;
            z-index: 10;
        }
    </style>
    <!-- Fixed Three.js CDN Link -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>

    <script>
        let scene, camera, renderer;
        let fruits = [];
        let score = 0;
        let isSwiping = false;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 7;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Pointer Events for mobile touch & desktop mouse
            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);

            // Start spawning 3D fruits
            setInterval(spawnFruit, 1200);
        }

        function spawnFruit() {
            const fruitGroup = new THREE.Group();

            // 3D Sphere Fruit
            const geometry = new THREE.SphereGeometry(0.7, 32, 32);
            
            // Random vibrant colors
            const colors = [0xff3366, 0x33ff66, 0xffcc00, 0x9933ff, 0xff6600];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            const material = new THREE.MeshStandardMaterial({ 
                color: randomColor, 
                roughness: 0.2,
                metalness: 0.1 
            });
            
            const fullFruit = new THREE.Mesh(geometry, material);
            fullFruit.name = "full_fruit";
            fruitGroup.add(fullFruit);

            // Spawn from bottom
            fruitGroup.position.x = (Math.random() - 0.5) * 3.5;
            fruitGroup.position.y = -4.5;
            fruitGroup.position.z = 0;

            fruitGroup.userData = {
                velocityY: 0.15 + Math.random() * 0.04,
                velocityX: (Math.random() - 0.5) * 0.03,
                rotSpeedX: Math.random() * 0.08,
                rotSpeedY: Math.random() * 0.08,
                isCut: false
            };

            scene.add(fruitGroup);
            fruits.push(fruitGroup);
        }

        function onPointerDown(event) {
            isSwiping = true;
            checkIntersection(event);
        }

        function onPointerMove(event) {
            if (isSwiping) {
                checkIntersection(event);
            }
        }

        function onPointerUp() {
            isSwiping = false;
        }

        function checkIntersection(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            fruits.forEach((fruitGroup) => {
                if (!fruitGroup.userData.isCut) {
                    const intersects = raycaster.intersectObjects(fruitGroup.children);
                    if (intersects.length > 0) {
                        sliceFruit(fruitGroup);
                    }
                }
            });
        }

        function sliceFruit(fruitGroup) {
            fruitGroup.userData.isCut = true;

            const originalMesh = fruitGroup.getObjectByName("full_fruit");
            if (originalMesh) fruitGroup.remove(originalMesh);

            // Create 3D Cut Halves
            const halfGeo = new THREE.SphereGeometry(0.7, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            const insideMat = new THREE.MeshStandardMaterial({ color: 0xff4444, side: THREE.DoubleSide });
            
            const leftHalf = new THREE.Mesh(halfGeo, insideMat);
            leftHalf.position.x = -0.1;
            leftHalf.rotation.z = Math.PI / 2;

            const rightHalf = new THREE.Mesh(halfGeo, insideMat);
            rightHalf.position.x = 0.1;
            rightHalf.rotation.z = -Math.PI / 2;

            fruitGroup.add(leftHalf);
            fruitGroup.add(rightHalf);

            fruitGroup.userData.leftHalf = leftHalf;
            fruitGroup.userData.rightHalf = rightHalf;

            score += 10;
            document.getElementById('score').innerText = score;
        }

        function animate() {
            requestAnimationFrame(animate);

            for (let i = fruits.length - 1; i >= 0; i--) {
                const fruit = fruits[i];

                fruit.position.y += fruit.userData.velocityY;
                fruit.position.x += fruit.userData.velocityX;
                fruit.userData.velocityY -= 0.0035; // Smooth gravity

                fruit.rotation.x += fruit.userData.rotSpeedX;
                fruit.rotation.y += fruit.userData.rotSpeedY;

                if (fruit.userData.isCut) {
                    if (fruit.userData.leftHalf) fruit.userData.leftHalf.position.x -= 0.04;
                    if (fruit.userData.rightHalf) fruit.userData.rightHalf.position.x += 0.04;
                }

                if (fruit.position.y < -5.5) {
                    scene.remove(fruit);
                    fruits.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
