<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Apple Precision Cutter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #score { font-size: 26px; font-weight: bold; }
        #accuracy { font-size: 18px; color: #4CAF50; margin-top: 5px; }
        #instructions {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 16px;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading">Loading Real 3D Apple...</div>

    <div id="ui">
        <div id="score">Score: 0</div>
        <div id="accuracy">Target: Cut Apple at 50-50 Center</div>
    </div>
    <div id="instructions">Swipe across the Apple to slice it!</div>

    <script>
        let scene, camera, renderer;
        let appleModel, knife;
        let score = 0;
        let isTracing = false;
        let startPoint = null, endPoint = null;
        let isCut = false;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 8);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting setup for Real 3D textures
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            createKnife();
            load3DApple();

            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('resize', onWindowResize);
        }

        function createKnife() {
            knife = new THREE.Group();
            
            // Blade
            const bladeGeo = new THREE.BoxGeometry(0.04, 1.2, 0.2);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            blade.position.y = 0.6;
            knife.add(blade);

            // Handle
            const handleGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.4);
            const handleMat = new THREE.MeshStandardMaterial({ color: 0x4a2c11 });
            const handle = new THREE.Mesh(handleGeo, handleMat);
            handle.position.y = -0.1;
            knife.add(handle);

            knife.position.set(0, 2.5, 0.5);
            scene.add(knife);
        }

        function load3DApple() {
            const loader = new THREE.GLTFLoader();

            // Loading Apple GLTF/GLB model file
            loader.load('scene.gltf', function (gltf) {
                appleModel = gltf.scene;

                // Center and Scale the Apple model properly
                const box = new THREE.Box3().setFromObject(appleModel);
                const center = box.getCenter(new THREE.Vector3());
                appleModel.position.sub(center); // Center pivot

                // Adjust scale so it fits nicely on screen
                appleModel.scale.set(0.01, 0.01, 0.01); 
                appleModel.position.set(0, 0, 0);

                scene.add(appleModel);
                document.getElementById('loading').style.display = 'none';
            }, undefined, function (error) {
                console.error('Error loading 3D model, fallback placeholder loaded:', error);
                document.getElementById('loading').innerText = "Model file 'scene.gltf' missing! Place it in repo.";
            });
        }

        function onPointerDown(event) {
            if (isCut) return;
            isTracing = true;
            startPoint = getNormalizedVector(event);
        }

        function onPointerMove(event) {
            const vector = getNormalizedVector(event);
            knife.position.x = vector.x * 3.5;
            knife.position.y = vector.y * 3.5 + 0.5;

            if (isTracing) {
                endPoint = vector;
            }
        }

        function onPointerUp() {
            if (isTracing && startPoint && endPoint) {
                isTracing = false;
                calculateCutAccuracy();
            }
        }

        function getNormalizedVector(event) {
            return {
                x: (event.clientX / window.innerWidth) * 2 - 1,
                y: -(event.clientY / window.innerHeight) * 2 + 1
            };
        }

        function calculateCutAccuracy() {
            const dx = endPoint.x - startPoint.x;
            const dy = endPoint.y - startPoint.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 0.2) return; // Touch too short

            const midX = (startPoint.x + endPoint.x) / 2;
            const midY = (startPoint.y + endPoint.y) / 2;
            const offsetFromCenter = Math.sqrt(midX * midX + midY * midY);

            // Accuracy calculation
            let accuracy = Math.max(0, Math.round((1 - offsetFromCenter * 2.2) * 100));

            if (accuracy >= 80) {
                document.getElementById('accuracy').innerText = `Perfect Cut! Accuracy: ${accuracy}%`;
                document.getElementById('accuracy').style.color = "#4CAF50";
                score += 10;
                document.getElementById('score').innerText = `Score: ${score}`;
                sliceAppleModel();
            } else {
                document.getElementById('accuracy').innerText = `Missed Center! Accuracy: ${accuracy}% (Target >= 80%)`;
                document.getElementById('accuracy').style.color = "#FF5252";
            }
        }

        function sliceAppleModel() {
            if (!appleModel || isCut) return;
            isCut = true;

            // Split animation: Rotate and move halves
            let timer = 0;
            const interval = setInterval(() => {
                timer += 0.05;
                appleModel.position.x += 0.02;
                appleModel.rotation.y += 0.05;

                if (timer > 1.2) {
                    clearInterval(interval);
                    // Reset Apple after 1 second
                    setTimeout(() => {
                        appleModel.position.set(0, 0, 0);
                        appleModel.rotation.set(0, 0, 0);
                        isCut = false;
                    }, 800);
                }
            }, 16);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Slow idle spin when waiting for cut
            if (appleModel && !isCut) {
                appleModel.rotation.y += 0.005;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
