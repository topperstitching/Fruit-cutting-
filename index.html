<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Player Neon Soccer Pong</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            margin-bottom: 10px;
            font-size: 24px;
            letter-spacing: 2px;
            color: #00f2fe;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.6);
        }
        .scoreboard {
            display: flex;
            justify-content: space-between;
            width: 700px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 30px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .score-card {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .score-number {
            font-size: 28px;
            padding: 2px 14px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
        }
        #p1-score { color: #ff007f; border: 1px solid #ff007f; }
        #p2-score { color: #00f2fe; border: 1px solid #00f2fe; }

        .game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid rgba(255, 255, 255, 0.2);
        }
        canvas {
            display: block;
            background-color: #0d1117;
            touch-action: none;
        }
        .instructions {
            margin-top: 15px;
            font-size: 13px;
            color: #ccc;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 20px;
            border-radius: 20px;
            display: flex;
            gap: 20px;
        }
    </style>
</head>
<body>

    <h1>2-PLAYER NEON SOCCER</h1>

    <div class="scoreboard">
        <div class="score-card">
            <span style="color: #ff007f;">Player 1 (Left)</span>
            <span id="p1-score" class="score-number">0</span>
        </div>
        <div class="score-card">
            <span id="p2-score" class="score-number">0</span>
            <span style="color: #00f2fe;">Player 2 (Right)</span>
        </div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="700" height="450"></canvas>
    </div>

    <div class="instructions">
        <span><b>Player 1:</b> [W] [S] keys / Screen Left Touch</span>
        <span><b>Player 2:</b> [↑] [↓] keys / Screen Right Touch</span>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const p1ScoreElem = document.getElementById("p1-score");
        const p2ScoreElem = document.getElementById("p2-score");

        let player1Score = 0;
        let player2Score = 0;

        const goalHeight = 160;
        const goalY = (canvas.height - goalHeight) / 2;
        const paddleWidth = 14;
        const paddleHeight = 90;
        const paddleSpeed = 8;

        const p1 = {
            x: 25,
            y: canvas.height / 2 - paddleHeight / 2,
            w: paddleWidth,
            h: paddleHeight,
            color: "#ff007f",
            up: false,
            down: false
        };

        const p2 = {
            x: canvas.width - 25 - paddleWidth,
            y: canvas.height / 2 - paddleHeight / 2,
            w: paddleWidth,
            h: paddleHeight,
            color: "#00f2fe",
            up: false,
            down: false
        };

        // Faster ball initial speed
        const initialSpeed = 9;
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            r: 10,
            vx: initialSpeed,
            vy: 5,
            speed: initialSpeed,
            color: "#fff"
        };

        // Keyboard Controls
        window.addEventListener("keydown", (e) => {
            if (e.key === "w" || e.key === "W") p1.up = true;
            if (e.key === "s" || e.key === "S") p1.down = true;
            if (e.key === "ArrowUp") p2.up = true;
            if (e.key === "ArrowDown") p2.down = true;
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "w" || e.key === "W") p1.up = false;
            if (e.key === "s" || e.key === "S") p1.down = false;
            if (e.key === "ArrowUp") p2.up = false;
            if (e.key === "ArrowDown") p2.down = false;
        });

        // Touch Controls for 2 Players (Multi-touch support)
        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            for (let i = 0; i < e.touches.length; i++) {
                let touch = e.touches[i];
                let touchX = touch.clientX - rect.left;
                let touchY = touch.clientY - rect.top;

                if (touchX < canvas.width / 2) {
                    p1.y = Math.max(5, Math.min(canvas.height - p1.h - 5, touchY - p1.h / 2));
                } else {
                    p2.y = Math.max(5, Math.min(canvas.height - p2.h - 5, touchY - p2.h / 2));
                }
            }
        }

        canvas.addEventListener("touchstart", handleTouch, { passive: false });
        canvas.addEventListener("touchmove", handleTouch, { passive: false });

        function resetBall(scorer) {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.speed = initialSpeed;
            ball.vx = (scorer === 1 ? 1 : -1) * ball.speed;
            ball.vy = (Math.random() > 0.5 ? 1 : -1) * (4 + Math.random() * 3);
        }

        function checkPaddleCollision(b, p) {
            return (
                b.x - b.r < p.x + p.w &&
                b.x + b.r > p.x &&
                b.y + b.r > p.y &&
                b.y - b.r < p.y + p.h
            );
        }

        function updatePaddles() {
            if (p1.up && p1.y > 5) p1.y -= paddleSpeed;
            if (p1.down && p1.y < canvas.height - p1.h - 5) p1.y += paddleSpeed;

            if (p2.up && p2.y > 5) p2.y -= paddleSpeed;
            if (p2.down && p2.y < canvas.height - p2.h - 5) p2.y += paddleSpeed;
        }

        function update() {
            updatePaddles();

            ball.x += ball.vx;
            ball.y += ball.vy;

            // Bounce off Top & Bottom Walls
            if (ball.y - ball.r < 0) {
                ball.y = ball.r;
                ball.vy = -ball.vy;
            } else if (ball.y + ball.r > canvas.height) {
                ball.y = canvas.height - ball.r;
                ball.vy = -ball.vy;
            }

            // Left Side: Goal check vs Wall bounce
            if (ball.x - ball.r <= 0) {
                if (ball.y >= goalY && ball.y <= goalY + goalHeight) {
                    player2Score++;
                    p2ScoreElem.textContent = player2Score;
                    resetBall(2);
                    return;
                } else {
                    ball.x = ball.r;
                    ball.vx = -ball.vx;
                }
            }

            // Right Side: Goal check vs Wall bounce
            if (ball.x + ball.r >= canvas.width) {
                if (ball.y >= goalY && ball.y <= goalY + goalHeight) {
                    player1Score++;
                    p1ScoreElem.textContent = player1Score;
                    resetBall(1);
                    return;
                } else {
                    ball.x = canvas.width - ball.r;
                    ball.vx = -ball.vx;
                }
            }

            // Paddle 1 Collision
            if (checkPaddleCollision(ball, p1)) {
                ball.x = p1.x + p1.w + ball.r;
                let collidePoint = (ball.y - (p1.y + p1.h / 2)) / (p1.h / 2);
                let angleRad = (Math.PI / 3) * collidePoint;
                ball.speed = Math.min(ball.speed + 0.4, 18); // Gradually speeds up
                ball.vx = ball.speed * Math.cos(angleRad);
                ball.vy = ball.speed * Math.sin(angleRad);
            }

            // Paddle 2 Collision
            if (checkPaddleCollision(ball, p2)) {
                ball.x = p2.x - ball.r;
                let collidePoint = (ball.y - (p2.y + p2.h / 2)) / (p2.h / 2);
                let angleRad = (Math.PI / 3) * collidePoint;
                ball.speed = Math.min(ball.speed + 0.4, 18);
                ball.vx = -ball.speed * Math.cos(angleRad);
                ball.vy = ball.speed * Math.sin(angleRad);
            }
        }

        function drawBackground() {
            ctx.fillStyle = "#0a0d14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Center Line
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.setLineDash([8, 8]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Center Circle
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 60, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.lineWidth = 2;
            ctx.stroke();

            // Left Goal Net Area
            ctx.fillStyle = "rgba(255, 0, 127, 0.15)";
            ctx.fillRect(0, goalY, 15, goalHeight);
            ctx.strokeStyle = "#ff007f";
            ctx.lineWidth = 3;
            ctx.strokeRect(0, goalY, 15, goalHeight);

            // Right Goal Net Area
            ctx.fillStyle = "rgba(0, 242, 254, 0.15)";
            ctx.fillRect(canvas.width - 15, goalY, 15, goalHeight);
            ctx.strokeStyle = "#00f2fe";
            ctx.lineWidth = 3;
            ctx.strokeRect(canvas.width - 15, goalY, 15, goalHeight);
        }

        function drawPaddle(p) {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            
            ctx.beginPath();
            ctx.roundRect(p.x, p.y, p.w, p.h, 6);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function drawBall() {
            ctx.fillStyle = ball.color;
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 15;

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowBlur = 0;
        }

        function render() {
            drawBackground();
            drawPaddle(p1);
            drawPaddle(p2);
            drawBall();
        }

        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
