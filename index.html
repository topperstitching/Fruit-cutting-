<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Apple Runner Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
            touch-action: none;
            font-family: Arial, sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #score { font-size: 28px; font-weight: bold; color: #facc15; }
        #instructions {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #94a3b8;
            font-size: 16px;
            pointer-events: none;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
        }
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 25px 40px;
            border-radius: 12px;
            text-align: center;
            color: white;
            z-index: 20;
        }
        #restart-btn {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #22c55e;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
    <!-- Three.js and GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading">Loading 3D Apple Runner...</div>

    <div id="ui">
        <div id="score">Score: 0</div>
    </div>

    <div id="game-over">
        <h1 style="color: #ef4444; margin: 0 0 10px 0;">Game Over!</h1>
        <div id="final-score" style="font-size: 20px;">Score: 0</div>
        <button id="restart-btn" onclick="resetGame()">Play Again</button>
    </div>

    <div id="instructions">Swipe Left/Right to change lanes | Swipe Up to Jump</div>

    <script>
        let scene, camera, renderer;
        let appleModel, track;
        let score = 0, speed = 0.3;
        let currentLane = 0; // -1: Left, 0: Center, 1: Right
        const laneX = [-2, 0, 2];
        let isJumping = false, jumpVelocity = 0;
        const gravity = -0.015;
        let obstacles = [];
        let isGameOver = false;
        let touchStartX = 0, touchStartY = 0;

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.Fog(0x0f172a, 10, 50);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.rotation.x = -0.3;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 15, 10);
            scene.add(dirLight);

            createTrack();
            load3DApple();

            // Event Listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('touchstart', handleTouchStart);
            window.addEventListener('touchend', handleTouchEnd);
            window.addEventListener('resize', onWindowResize);
        }

        function createTrack() {
            const trackGeo = new THREE.PlaneGeometry(7, 200);
            const trackMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
            track = new THREE.Mesh(trackGeo, trackMat);
            track.rotation.x = -Math.PI / 2;
            track.position.z = -80;
            scene.add(track);

            // Lane markers
            for (let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.1, 200);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x64748b });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * 1.3, 0.01, -80);
                scene.add(line);
            }
        }

        function load3DApple() {
            const loader = new THREE.GLTFLoader();

            // Redirect textures path to root
            const manager = new THREE.LoadingManager();
            loader.manager = manager;
            manager.setURLModifier((url) => {
                if (url.includes('textures/')) return url.replace('textures/', '');
                return url;
            });

            loader.load('scene.gltf', function (gltf) {
                appleModel = gltf.scene;

                const box = new THREE.Box3().setFromObject(appleModel);
                const center = box.getCenter(new THREE.Vector3());
                appleModel.position.sub(center);

                appleModel.scale.set(0.008, 0.008, 0.008); 
                appleModel.position.set(0, 0.6, 0);

                scene.add(appleModel);
                document.getElementById('loading').style.display = 'none';
            }, undefined, function (error) {
                console.error(error);
                document.getElementById('loading').innerText = "Failed to load 'scene.gltf'";
            });
        }

        function spawnObstacle() {
            if (isGameOver) return;

            const obstacleGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const obstacleMat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.3 });
            const obstacle = new THREE.Mesh(obstacleGeo, obstacleMat);

            const randomLane = laneX[Math.floor(Math.random() * 3)];
            obstacle.position.set(randomLane, 0.6, -40);

            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function handleKeyDown(e) {
            if (isGameOver) return;
            if (e.key === "ArrowLeft" && currentLane > -1) currentLane--;
            if (e.key === "ArrowRight" && currentLane < 1) currentLane++;
            if ((e.key === "ArrowUp" || e.key === " ") && !isJumping) {
                isJumping = true;
                jumpVelocity = 0.25;
            }
        }

        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }

        function handleTouchEnd(e) {
            if (isGameOver) return;
            const diffX = e.changedTouches[0].clientX - touchStartX;
            const diffY = e.changedTouches[0].clientY - touchStartY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 30 && currentLane < 1) currentLane++;
                else if (diffX < -30 && currentLane > -1) currentLane--;
            } else {
                if (diffY < -30 && !isJumping) {
                    isJumping = true;
                    jumpVelocity = 0.25;
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isGameOver) return;

            // Player movement
            if (appleModel) {
                // Smooth lane change
                appleModel.position.x += (laneX[currentLane + 1] - appleModel.position.x) * 0.2;

                // Jump mechanics
                if (isJumping) {
                    appleModel.position.y += jumpVelocity;
                    jumpVelocity += gravity;
                    if (appleModel.position.y <= 0.6) {
                        appleModel.position.y = 0.6;
                        isJumping = false;
                    }
                }

                // Apple Forward Spin
                appleModel.rotation.x += 0.05;
            }

            // Spawn Obstacles
            if (Math.random() < 0.02) spawnObstacle();

            // Move Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += speed;

                // Collision Detection
                if (appleModel) {
                    const distZ = Math.abs(obs.position.z - appleModel.position.z);
                    const distX = Math.abs(obs.position.x - appleModel.position.x);
                    const distY = Math.abs(obs.position.y - obs.position.y);

                    if (distZ < 0.8 && distX < 0.8 && appleModel.position.y < 1.2) {
                        triggerGameOver();
                    }
                }

                // Remove past obstacles
                if (obs.position.z > 5) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                    score += 10;
                    document.getElementById('score').innerText = `Score: ${score}`;
                    if (score % 100 === 0) speed += 0.02; // Increase speed slowly
                }
            }

            renderer.render(scene, camera);
        }

        function triggerGameOver() {
            isGameOver = true;
            document.getElementById('final-score').innerText = `Score: ${score}`;
            document.getElementById('game-over').style.display = 'block';
        }

        function resetGame() {
            isGameOver = false;
            score = 0;
            speed = 0.3;
            currentLane = 0;
            document.getElementById('score').innerText = `Score: 0`;
            document.getElementById('game-over').style.display = 'none';

            // Clear obstacles
            for (let obs of obstacles) scene.remove(obs);
            obstacles = [];

            if (appleModel) appleModel.position.set(0, 0.6, 0);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
